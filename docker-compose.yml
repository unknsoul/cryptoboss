# CryptoBoss v11.0-FINAL Docker Compose
# Production-grade deployment stack

version: '3.8'

services:
  # ==========================================================================
  # Trading Bot - Core Application
  # ==========================================================================
  trading-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cryptoboss_bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Exchange credentials (via .env file)
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}

      # Database
      - DATABASE_URL=postgresql://cryptoboss:${POSTGRES_PASSWORD}@postgres:5432/cryptoboss
      - REDIS_URL=redis://redis:6379/0
      - BOT_CONFIG_PATH=/app/configs/bot_config.yaml

      # Execution mode (paper/live)
      - EXECUTION_MODE=${EXECUTION_MODE:-paper}

      # Risk controls
      - ENABLE_DAILY_LOSS_LIMITS=true
      - DAILY_LOSS_LIMIT_PCT=${DAILY_LOSS_LIMIT_PCT:-3.0}
      - MAX_POSITION_SIZE_USD=${MAX_POSITION_SIZE_USD:-1000}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MARKET_TIMEZONE=America/New_York
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./configs:/app/configs:ro
    networks:
      - trading-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v11/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: cryptoboss_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cryptoboss
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=cryptoboss
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - trading-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cryptoboss" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: cryptoboss_cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - trading-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Frontend Dashboard
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cryptoboss_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://trading-bot:8000
      - NEXT_PUBLIC_WS_URL=ws://trading-bot:8000/ws/v11/stream
    networks:
      - trading-net
    depends_on:
      - trading-bot

  # ==========================================================================
  # Prometheus Metrics (Optional)
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: cryptoboss_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - trading-net
    profiles:
      - monitoring

  # ==========================================================================
  # Grafana Dashboards (Optional)
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: cryptoboss_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - trading-net
    depends_on:
      - prometheus
    profiles:
      - monitoring

networks:
  trading-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
