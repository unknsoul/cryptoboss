strategy:
  id: aggressive_scalper_v1
  version: "3.0"
  type: AggressiveScalper
  enabled: true

rsi:
  period: 7
  fast_period: 4
  oversold: 32
  overbought: 68

macd:
  fast: 6
  slow: 13
  signal: 4

ema:
  fast: 8
  slow: 21

atr:
  period: 10

volume:
  ma_period: 14
  spike_threshold: 1.3

adx:
  period: 10
  min_trend: 15

risk:
  stop_loss_atr_mult: 0.55
  take_profit_1_mult: 1.8
  take_profit_2_mult: 3.0
  take_profit_3_mult: 5.0
  max_position_pct: 6.0
