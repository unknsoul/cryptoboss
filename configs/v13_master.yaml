# CryptoBoss v13.0 MASTER configuration

system:
  version: 13.0-MASTER
  generated: "2026-04-18"
  log_level: INFO

exchange:
  primary: binance
  environment: PAPER
  spot_enabled: true
  futures_enabled: false
  mode: testnet

strategies:
  hf_scalper:
    enabled: true
    capital_pct: 0.15
    max_leverage: 1
  intraday_scalper:
    enabled: true
    capital_pct: 0.15
    max_leverage: 1
  smc_day_trader:
    enabled: false
    capital_pct: 0.25
    max_leverage: 2
  trend_momentum:
    enabled: false
    capital_pct: 0.2
    max_leverage: 2
  dca_accumulator:
    enabled: true
    capital_pct: 0.15
    max_leverage: 1
  grid_range_trader:
    enabled: true
    capital_pct: 0.1
    max_leverage: 1
  breakout_hunter:
    enabled: false
    capital_pct: 0.1
    max_leverage: 1.5
  stat_arb:
    enabled: false
    capital_pct: 0.05
    max_leverage: 3

risk:
  max_portfolio_drawdown: 0.15
  daily_loss_limit: 0.05
  emergency_stop_drawdown: 0.2
  limits:
    max_risk_pct_scalp: 0.01
    max_risk_pct_day_trade: 0.015
    max_risk_pct_swing: 0.02
    strategy_daily_loss_pct: 0.03
    strategy_weekly_drawdown_pct: 0.08
    max_errors_per_minute: 10
    max_consecutive_losses: 7

futures:
  enabled: false
  default_leverage: 3
  max_leverage: 10
  min_liquidation_distance_pct: 0.25

ml:
  enabled: true
  prediction_threshold: 0.55
  retrain_daily: true
  retrain_cron: "0 2 * * *"
  model_registry: mlflow
  production_model_path: models/production_ensemble.pkl

pipeline:
  minimum_score: 65
  stage_order:
    - market_data_ingestion
    - market_context_engine
    - context_state_machine
    - bias_engine
    - strategy_proposals
    - ml_intelligence_gate
    - scoring_contract
    - trade_permission_filter
    - capital_governor
    - risk_guardian
